[project]
name = "lutron-builder"
version = "1.4.1"
description = "Turns lighting-plan PDFs into a Lutron HomeWorks project file"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Homeplay", email = "hello@homeplay.tv" }]
keywords = ["lutron", "homeworks", "lighting", "control", "designer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# The writer itself is standard library only, deliberately -- it has to run on a
# machine that has Lutron Designer and nothing else.
dependencies = []

[project.optional-dependencies]
# Only the plan-reading step needs an AI client. pypdf is used by the
# "read as text" option, which lifts a document's text layer instead of
# sending its pages as pictures.
ingest = ["anthropic>=0.40", "pypdf>=4"]
# Reading an AutoCAD drawing. `ezdwg` is a Rust core behind a Python API, MIT
# licensed, and it is what sets the 3.10 floor for the whole project -- there
# is no wheel below it. Only the drawing route needs it; the writer does not.
dwg = ["ezdwg>=0.11"]
dev = ["pytest>=7", "ruff>=0.6", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/homeplayltd/lutron-builder"
Issues = "https://github.com/homeplayltd/lutron-builder/issues"
Changelog = "https://github.com/homeplayltd/lutron-builder/blob/main/CHANGELOG.md"

[project.scripts]
hwwriter = "hwwriter.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hwwriter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The app embeds its UI as one long HTML/JS string; wrapping it would hurt more
# than it helps.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
